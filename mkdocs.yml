      - លំហាត់ ៩ — សំណួរ: labs/lab09.md
      - លំហាត់ ១០ — បាហ្វ័រ និង Overlay: labs/lab10.md
      - លំហាត់ ១១ — ពីជគណិតផែនទី: labs/lab11.md
      - លំហាត់ ១២ — DEM និងអាងទឹក: labs/lab12.md
      - លំហាត់ ១៣ — ប្លង់ផែនទី: labs/lab13.md
