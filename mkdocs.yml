site_name: មូលដ្ឋានគ្រឹះនៃប្រព័ន្ធព័ត៌មានភូមិសាស្ត្រ
site_description: សៀវភៅសិក្សា GIS ជាភាសាខ្មែរ សម្រាប់វគ្គសិក្សា ១ ឆមាស
site_author: YAM Sarath (យាំ សារដ្ឋ)
site_url: https://khgeo.github.io/gis-fundamentals/
repo_url: https://github.com/khgeo/gis-fundamentals
repo_name: gis-fundamentals
edit_uri: edit/main/docs/
copyright: CC BY-SA 4.0 · អាចប្រើ និងកែសម្រួលបាន ដោយដកស្រង់ប្រភព

theme:
  name: material
  language: en          # Material has no Khmer UI pack; content is Khmer
  font: false           # disable Google Fonts CDN; we load Khmer fonts in CSS
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: ប្ដូរទៅរបៀបងងឹត
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: ប្ដូរទៅរបៀបភ្លឺ

extra_css:
  - https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Siemreap&family=Moul&display=swap
  - assets/css/khmer.css
  - https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css
  - assets/css/workbook.css
  - assets/css/lesson-sims.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js
  - assets/js/lesson-sims.js
  - assets/js/workbook.js

markdown_extensions:
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [docs]
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: "¶"
      toc_depth: 3

plugins:
  - search

extra:
  homepage: https://khgeo.github.io/
  social:
    - icon: material/bookshelf
      link: https://khgeo.github.io/
      name: ស៊េរីសៀវភៅទាំង ៤

  # Uncomment after `pip install mkdocs-with-pdf` to build a single PDF:
  # - with-pdf:
  #     output_path: pdf/gis-fundamentals.pdf
  #     cover_title: មូលដ្ឋានគ្រឹះនៃប្រព័ន្ធព័ត៌មានភូមិសាស្ត្រ
  #     cover_subtitle: សៀវភៅសិក្សា ១ ឆមាស

nav:
  - ទំព័រដើម: index.md
  - កម្មវិធីសិក្សា: syllabus.md
  - ជំពូកទី១៖ ប្រព័ន្ធ GIS និងគំរូទិន្នន័យ:
      - មេរៀនទី១៖ GIS និងការគិតតាមលំហ: lessons/lesson-01.md
      - មេរៀនទី២៖ គំរូទិន្នន័យវ៉ិចទ័រ និងឋានលេខា: lessons/lesson-02.md
      - មេរៀនទី៣៖ គំរូទិន្នន័យរ៉ាស្ទ័រ និងការជ្រើសរើសគំរូ: lessons/lesson-03.md
  - ជំពូកទី២៖ គុណលក្ខណៈ និងមូលទិន្នន័យ:
      - មេរៀនទី៤៖ គុណលក្ខណៈ និងតារាងទិន្នន័យ: lessons/lesson-04.md
      - មេរៀនទី៥៖ មូលទិន្នន័យ ការភ្ជាប់តារាង និង Field Calculator: lessons/lesson-05.md
  - ជំពូកទី៣៖ ទិន្នន័យ និងគុណភាព:
      - មេរៀនទី៦៖ ប្រភព និងការប្រមូលទិន្នន័យ: lessons/lesson-06.md
      - មេរៀនទី៧៖ ការបំប្លែងទៅឌីជីថល និង Georeferencing: lessons/lesson-07.md
      - មេរៀនទី៨៖ គុណភាពទិន្នន័យ កំហុស និងមេតាទិន្នន័យ: lessons/lesson-08.md
  - ជំពូកទី៤៖ ការវិភាគលំហ:
      - មេរៀនទី៩៖ សំណួរតាមគុណលក្ខណៈ និងតាមលំហ: lessons/lesson-09.md
      - មេរៀនទី១០៖ បាហ្វ័រ និងការវិភាគភាពជិត: lessons/lesson-10.md
      - មេរៀនទី១១៖ ការត្រួតស្រទាប់ និង Spatial join: lessons/lesson-11.md
      - មេរៀនទី១២៖ ការវិភាគរ៉ាស្ទ័រ និងពីជគណិតផែនទី: lessons/lesson-12.md
      - មេរៀនទី១៣៖ ផ្ទៃ ទីសណ្ឋាន និងអាំងទែប៉ូឡាស្យុង: lessons/lesson-13.md
  - ជំពូកទី៥៖ ការអនុវត្ត និងគម្រោង:
      - មេរៀនទី១៤៖ ការវិភាគសមស្របភាពពហុលក្ខខណ្ឌ: lessons/lesson-14.md
      - មេរៀនទី១៥៖ ការគ្រប់គ្រងគម្រោង ការចែករំលែក និងគម្រោងបញ្ចប់វគ្គ: lessons/lesson-15.md
  - សៀវភៅអនុវត្ត (លំហាត់ QGIS):
      - លំហាត់ទី១៖ GIS និងការគិតតាមលំហ: workbook/lab-01.md
      - លំហាត់ទី២៖ គំរូទិន្នន័យវ៉ិចទ័រ និងឋានលេខា: workbook/lab-02.md
      - លំហាត់ទី៣៖ គំរូទិន្នន័យរ៉ាស្ទ័រ និងការជ្រើសរើសគំរូ: workbook/lab-03.md
      - លំហាត់ទី៤៖ គុណលក្ខណៈ និងតារាងទិន្នន័យ: workbook/lab-04.md
      - លំហាត់ទី៥៖ មូលទិន្នន័យ ការភ្ជាប់តារាង និង Field Calculator: workbook/lab-05.md
      - លំហាត់ទី៦៖ ប្រភព និងការប្រមូលទិន្នន័យ: workbook/lab-06.md
      - លំហាត់ទី៧៖ ការបំប្លែងទៅឌីជីថល និង Georeferencing: workbook/lab-07.md
      - លំហាត់ទី៨៖ គុណភាពទិន្នន័យ កំហុស និងមេតាទិន្នន័យ: workbook/lab-08.md
      - លំហាត់ទី៩៖ សំណួរតាមគុណលក្ខណៈ និងតាមលំហ: workbook/lab-09.md
      - លំហាត់ទី១០៖ បាហ្វ័រ និងការវិភាគភាពជិត: workbook/lab-10.md
      - លំហាត់ទី១១៖ ការត្រួតស្រទាប់ និង Spatial join: workbook/lab-11.md
      - លំហាត់ទី១២៖ ការវិភាគរ៉ាស្ទ័រ និងពីជគណិតផែនទី: workbook/lab-12.md
      - លំហាត់ទី១៣៖ ផ្ទៃ ទីសណ្ឋាន និងអាំងទែប៉ូឡាស្យុង: workbook/lab-13.md
      - លំហាត់ទី១៤៖ ការវិភាគសមស្របភាពពហុលក្ខខណ្ឌ: workbook/lab-14.md
      - លំហាត់ទី១៥៖ ការគ្រប់គ្រងគម្រោង ការចែករំលែក និងគម្រោងបញ្ចប់វគ្គ: workbook/lab-15.md
  - ឧបសម្ព័ន្ធ:
      - ក៖ ដំឡើង QGIS: appendix/a-qgis-install.md
      - ខ៖ ទិន្នន័យកម្ពុជា: appendix/b-cambodia-data.md
