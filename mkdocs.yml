    - មេរៀន ១.១៖ ទីតាំង គុណលក្ខណៈ និងស្រទាប់: ch01/l1.md
    - មេរៀន ១.២៖ សមាសភាគទាំង ៥ និងសំណួរដែល GIS ឆ្លើយបាន: ch01/l2.md
    - មេរៀន ១.៣៖ GIS ក្នុងបរិបទ និងនៅកម្ពុជា: ch01/l3.md
