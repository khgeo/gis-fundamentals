site_name: មូលដ្ឋានគ្រឹះនៃប្រព័ន្ធព័ត៌មានភូមិសាស្ត្រ
site_description: សៀវភៅសិក្សា GIS ជាភាសាខ្មែរ សម្រាប់វគ្គសិក្សា ១ ឆមាស
site_author: YAM Sarath
site_url: https://khgeo.github.io/gis-fundamentals/
repo_url: https://github.com/khgeo/gis-fundamentals
repo_name: gis-fundamentals
edit_uri: edit/main/docs/
copyright: CC BY-SA 4.0 — អាចប្រើ និងកែសម្រួលបាន ដោយដកស្រង់ប្រភព

theme:
  name: material
  language: en          # Material has no Khmer UI pack; content is Khmer
  font: false           # disable Google Fonts CDN; we load Khmer fonts in CSS
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: ប្ដូរទៅរបៀបងងឹត
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: ប្ដូរទៅរបៀបភ្លឺ

extra_css:
  - https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Siemreap&family=Moul&display=swap
  - assets/css/khmer.css

markdown_extensions:
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [docs]
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: "¶"
      toc_depth: 3

plugins:
  - search
  # Uncomment after `pip install mkdocs-with-pdf` to build a single PDF:
  # - with-pdf:
  #     output_path: pdf/gis-fundamentals.pdf
  #     cover_title: មូលដ្ឋានគ្រឹះនៃប្រព័ន្ធព័ត៌មានភូមិសាស្ត្រ
  #     cover_subtitle: សៀវភៅសិក្សា ១ ឆមាស

nav:
  - ទំព័រដើម: index.md
  - កម្មវិធីសិក្សា: syllabus.md
  - ជំពូកទី១៖ ប្រព័ន្ធ GIS និងគំរូទិន្នន័យ:
      - មេរៀនទី១៖ GIS និងការគិតតាមលំហ: lessons/lesson-01.md
      - មេរៀនទី២៖ គំរូទិន្នន័យវ៉ិចទ័រ និងរ៉ាស្ទ័រ: lessons/lesson-02.md
      - មេរៀនទី៣៖ គុណលក្ខណៈ តារាង និងមូលទិន្នន័យ: lessons/lesson-03.md
  - ជំពូកទី២៖ ទិន្នន័យ និងគុណភាព:
      - មេរៀនទី៤៖ ប្រភព និងការប្រមូលទិន្នន័យ: lessons/lesson-04.md
      - មេរៀនទី៥៖ គុណភាព កំហុស Georeferencing និងមេតាទិន្នន័យ: lessons/lesson-05.md
  - ជំពូកទី៣៖ ការវិភាគលំហ:
      - មេរៀនទី៦៖ សំណួរតាមគុណលក្ខណៈ និងតាមលំហ: lessons/lesson-06.md
      - មេរៀនទី៧៖ បាហ្វ័រ និងការត្រួតស្រទាប់: lessons/lesson-07.md
      - មេរៀនទី៨៖ ការវិភាគរ៉ាស្ទ័រ និងពីជគណិតផែនទី: lessons/lesson-08.md
      - មេរៀនទី៩៖ ផ្ទៃ ទីសណ្ឋាន និងអាំងទែប៉ូឡាស្យុង: lessons/lesson-09.md
  - ជំពូកទី៤៖ ការអនុវត្ត និងគម្រោង:
      - មេរៀនទី១០៖ ការវិភាគសមស្របភាពពហុលក្ខខណ្ឌ: lessons/lesson-10.md
      - មេរៀនទី១១៖ ការគ្រប់គ្រងគម្រោង និងការចែករំលែកទិន្នន័យ: lessons/lesson-11.md
      - មេរៀនទី១២៖ គម្រោងអនុវត្តន៍ និងការបង្ហាញ: lessons/lesson-12.md
  - សៀវភៅអនុវត្ត (លំហាត់ QGIS):
      - លំហាត់ទី១៖ ស្គាល់ស្រទាប់ក្នុង QGIS: workbook/lab-01.md
      - លំហាត់ទី២៖ ប្រៀបធៀបវ៉ិចទ័រ និងរ៉ាស្ទ័រ: workbook/lab-02.md
      - លំហាត់ទី៣៖ Join និង Field Calculator: workbook/lab-03.md
      - លំហាត់ទី៤៖ ទាញយកទិន្នន័យ OSM: workbook/lab-04.md
      - លំហាត់ទី៥៖ Georeferencing: workbook/lab-05.md
      - លំហាត់ទី៦៖ សំណួរតាមលក្ខខណ្ឌ: workbook/lab-06.md
      - លំហាត់ទី៧៖ បាហ្វ័រ និង Overlay: workbook/lab-07.md
      - លំហាត់ទី៨៖ ពីជគណិតផែនទី: workbook/lab-08.md
      - លំហាត់ទី៩៖ DEM និងអាងទឹក: workbook/lab-09.md
      - លំហាត់ទី១០៖ សមស្របភាពពហុលក្ខខណ្ឌ: workbook/lab-10.md
      - លំហាត់ទី១១៖ បោះផ្សាយផែនទីវេប: workbook/lab-11.md
      - លំហាត់ទី១២៖ គម្រោងបញ្ចប់វគ្គ: workbook/lab-12.md
  - ឧបសម្ព័ន្ធ:
      - ក៖ ដំឡើង QGIS: appendix/a-qgis-install.md
      - ខ៖ ទិន្នន័យកម្ពុជា: appendix/b-cambodia-data.md
      - គ៖ ឯកសារយោង: appendix/c-references.md
  - វាក្យសព្ទបច្ចេកទេស: glossary.md
