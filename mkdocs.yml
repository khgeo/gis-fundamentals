site_name: មូលដ្ឋានគ្រឹះនៃប្រព័ន្ធព័ត៌មានភូមិសាស្ត្រ
site_description: សៀវភៅសិក្សា GIS ជាភាសាខ្មែរ សម្រាប់វគ្គសិក្សា ១ ឆមាស
site_author: YAM Sarath
# CHANGE THIS to your GitHub Pages URL:
site_url: https://khgeo.github.io/gis-fundamentals/
repo_url: https://github.com/khgeo/gis-fundamentals
repo_name: gis-fundamentals
edit_uri: edit/main/docs/
copyright: CC BY-SA 4.0 — អាចប្រើ និងកែសម្រួលបាន ដោយដកស្រង់ប្រភព

theme:
  name: material
  language: en          # Material has no Khmer UI pack; content is Khmer
  font: false           # disable Google Fonts CDN; we load Khmer fonts in CSS
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: ប្ដូរទៅរបៀបងងឹត
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: ប្ដូរទៅរបៀបភ្លឺ

extra_css:
  - assets/css/khmer.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: "¶"
      toc_depth: 3

plugins:
  - search
  # Uncomment after `pip install mkdocs-with-pdf` to build a single PDF:
  # - with-pdf:
  #     output_path: pdf/gis-fundamentals.pdf
  #     cover_title: មូលដ្ឋានគ្រឹះនៃប្រព័ន្ធព័ត៌មានភូមិសាស្ត្រ
  #     cover_subtitle: សៀវភៅសិក្សា ១ ឆមាស

nav:
  - ទំព័រដើម: index.md
  - កម្មវិធីសិក្សា: syllabus.md
  - ផ្នែកទី១ — មូលដ្ឋានគ្រឹះ:
      - ជំពូក ១ — អ្វីទៅជា GIS?: ch01-introduction.md
      - ជំពូក ២ — ធម្មជាតិនៃទិន្នន័យ: ch02-geographic-data.md
      - ជំពូក ៣ — ប្រព័ន្ធយោងកូអរដោនេ: ch03-coordinate-systems.md
  - ផ្នែកទី២ — គំរូទិន្នន័យ:
      - ជំពូក ៤ — គំរូវ៉ិចទ័រ: ch04-vector-model.md
      - ជំពូក ៥ — គំរូរ៉ាស្ទ័រ: ch05-raster-model.md
      - ជំពូក ៦ — គុណលក្ខណៈ និងមូលដ្ឋានទិន្នន័យ: ch06-attributes-database.md
  - ផ្នែកទី៣ — ការប្រមូល និងគុណភាព:
      - ជំពូក ៧ — ប្រភពទិន្នន័យ: ch07-data-sources.md
      - ជំពូក ៨ — គុណភាព និងកំហុស: ch08-data-quality.md
  - ផ្នែកទី៤ — ការវិភាគលំហ:
      - ជំពូក ៩ — សំណួរ: ch09-queries.md
      - ជំពូក ១០ — ការវិភាគវ៉ិចទ័រ: ch10-vector-analysis.md
      - ជំពូក ១១ — ការវិភាគរ៉ាស្ទ័រ: ch11-raster-analysis.md
      - ជំពូក ១២ — ផ្ទៃ និងទីសណ្ឋាន: ch12-surface-terrain.md
