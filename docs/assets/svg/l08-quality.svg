<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><path d="M200 165 L200.0 35.0 A130 130 0 0 1 312.6 100.0Z" fill="#1976d2" stroke="#fff" stroke-width="2" opacity="0.8"/><text class="km-xs" x="240.3" y="99.19835245497426" text-anchor="middle" style="fill:#fff" font-weight="700">ទីតាំង</text><path d="M200 165 L312.6 100.0 A130 130 0 0 1 312.6 230.0Z" fill="#8e24aa" stroke="#fff" stroke-width="2" opacity="0.8"/><text class="km-xs" x="280.6" y="169.0" text-anchor="middle" style="fill:#fff" font-weight="700">គុណលក្ខណៈ</text><path d="M200 165 L312.6 230.0 A130 130 0 0 1 200.0 295.0Z" fill="#e65100" stroke="#fff" stroke-width="2" opacity="0.8"/><text class="km-xs" x="240.3" y="238.80164754502573" text-anchor="middle" style="fill:#fff" font-weight="700">ស៊ីសង្វាក់</text><path d="M200 165 L200.0 295.0 A130 130 0 0 1 87.4 230.0Z" fill="#2e7d32" stroke="#fff" stroke-width="2" opacity="0.8"/><text class="km-xs" x="159.70000000000002" y="238.80164754502576" text-anchor="middle" style="fill:#fff" font-weight="700">ពេញលេញ</text><path d="M200 165 L87.4 230.0 A130 130 0 0 1 87.4 100.0Z" fill="#f9a825" stroke="#fff" stroke-width="2" opacity="0.8"/><text class="km-xs" x="119.4" y="169.0" text-anchor="middle" style="fill:#fff" font-weight="700">ពេលវេលា</text><path d="M200 165 L87.4 100.0 A130 130 0 0 1 200.0 35.0Z" fill="#6d4c41" stroke="#fff" stroke-width="2" opacity="0.8"/><text class="km-xs" x="159.69999999999996" y="99.19835245497427" text-anchor="middle" style="fill:#fff" font-weight="700">ប្រភពដើម</text><circle cx="200" cy="165" r="42" fill="var(--md-default-bg-color,#fff)" stroke="none" stroke-width="1.5" opacity="1"/><text class="km-s" x="200" y="170" text-anchor="middle" font-weight="700">គុណភាព</text><rect class="" x="380" y="45" width="14" height="14" rx="3" style="fill:#1976d2"/><text class="km-s" x="402" y="57" text-anchor="start">ទីតាំង៖ សាលា Yukunthor នៅក្រៅព្រំខេត្ត</text><rect class="" x="380" y="90" width="14" height="14" rx="3" style="fill:#8e24aa"/><text class="km-s" x="402" y="102" text-anchor="start">គុណលក្ខណៈ៖ ស្ទឹងត្រែងមានតម្លៃព្រះសីហនុ</text><rect class="" x="380" y="135" width="14" height="14" rx="3" style="fill:#e65100"/><text class="km-s" x="402" y="147" text-anchor="start">ស៊ីសង្វាក់៖ ពហុកោណជំនន់មិនត្រឹមត្រូវ ៣៥</text><rect class="" x="380" y="180" width="14" height="14" rx="3" style="fill:#2e7d32"/><text class="km-s" x="402" y="192" text-anchor="start">ពេញលេញ៖ វត្តគ្មានឈ្មោះ</text><rect class="" x="380" y="225" width="14" height="14" rx="3" style="fill:#f9a825"/><text class="km-s" x="402" y="237" text-anchor="start">ពេលវេលា៖ ជំរឿន ២០០៨ + ព្រំឃុំ ២០១៩</text><rect class="" x="380" y="270" width="14" height="14" rx="3" style="fill:#6d4c41"/><text class="km-s" x="402" y="282" text-anchor="start">ប្រភពដើម៖ ក្រប់ដីពីប្រភពបី</text></svg>
