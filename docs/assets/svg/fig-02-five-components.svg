<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222);text-anchor:middle}.km-c{font-size:14px;font-weight:700}.km-n{font-size:11.5px}.km-node{fill:var(--md-default-fg-color--lightest,#eee);stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-core{fill:var(--md-primary-fg-color,#00897b);opacity:.18;stroke:var(--md-primary-fg-color,#00897b);stroke-width:2}.km-sp{stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.3}.km-big{fill:var(--md-primary-fg-color,#00897b);opacity:.34}</style><line class="km-sp" x1="360" y1="150" x2="120" y2="70"/><line class="km-sp" x1="360" y1="150" x2="600" y2="70"/><line class="km-sp" x1="360" y1="150" x2="120" y2="240"/><line class="km-sp" x1="360" y1="150" x2="600" y2="240"/><line class="km-sp" x1="360" y1="150" x2="360" y2="272"/><ellipse class="km-core" cx="360" cy="150" rx="66" ry="40"/><text class="km-c" x="360" y="156">GIS</text><rect class="km-node" x="30" y="42" width="180" height="56" rx="8"/><text class="km-c" x="120" y="66">១. ផ្នែករឹង</text><text class="km-n" x="120" y="86">កុំព្យូទ័រ, GNSS, ដ្រូន</text><rect class="km-node" x="510" y="42" width="180" height="56" rx="8"/><text class="km-c" x="600" y="66">២. ផ្នែកទន់</text><text class="km-n" x="600" y="86">QGIS, PostGIS, GEE</text><rect class="km-big" x="30" y="212" width="180" height="56" rx="8"/><text class="km-c" x="120" y="236">៣. ទិន្នន័យ</text><text class="km-n" x="120" y="256">៦០–៨០% នៃថវិកា</text><rect class="km-big" x="510" y="212" width="180" height="56" rx="8"/><text class="km-c" x="600" y="236">៤. មនុស្ស</text><text class="km-n" x="600" y="256">កំណត់ជោគជ័យ ឬបរាជ័យ</text><rect class="km-node" x="270" y="248" width="180" height="46" rx="8"/><text class="km-c" x="360" y="272">៥. នីតិវិធី</text><text class="km-n" x="360" y="288">ស្តង់ដារ និងលំហូរការងារ</text></svg>
