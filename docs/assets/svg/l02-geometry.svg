<svg viewBox="0 0 740 260" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-read-stack,'Siemreap',sans-serif);fill:var(--md-default-fg-color,#222)}.km-h{font-family:var(--km-emph-stack,'Battambang',sans-serif);font-size:13px;font-weight:700;text-anchor:middle}.km-s{font-size:10.5px;text-anchor:middle}.km-xs{font-size:9.5px;fill:var(--md-default-fg-color--light,#666)}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.4}.km-ln{stroke:#1f6fb2;stroke-width:2.5;fill:none}.km-pg{fill:#7fb77e;opacity:.45;stroke:#2f6b2f;stroke-width:2}.km-vx{fill:#fff;stroke:#c0392b;stroke-width:2}.km-nd{fill:#c0392b}</style><rect class="km-box" x="16" y="30" width="220" height="150" rx="6"/><text class="km-h" x="126" y="22">ចំណុច</text><circle class="km-nd" cx="126" cy="105" r="7"/><text class="km-s" x="126" y="152">កូអរដោនេ ១ គូ (x, y)</text><text class="km-s" x="126" y="170">គ្មានប្រវែង គ្មានផ្ទៃ</text><rect class="km-box" x="258" y="30" width="220" height="150" rx="6"/><text class="km-h" x="368" y="22">បន្ទាត់</text><path class="km-ln" d="M292 140 L330 92 L392 124 L444 76"/><circle class="km-nd" cx="292" cy="140" r="6"/><circle class="km-vx" cx="330" cy="92" r="5"/><circle class="km-vx" cx="392" cy="124" r="5"/><circle class="km-nd" cx="444" cy="76" r="6"/><text class="km-s" x="368" y="166">មានប្រវែង គ្មានផ្ទៃ</text><rect class="km-box" x="500" y="30" width="224" height="150" rx="6"/><text class="km-h" x="612" y="22">ពហុកោណ</text><path class="km-pg" d="M545 145 L560 80 L640 68 L684 118 L640 155 Z"/><circle class="km-vx" cx="545" cy="145" r="5"/><circle class="km-vx" cx="560" cy="80" r="5"/><circle class="km-vx" cx="640" cy="68" r="5"/><circle class="km-vx" cx="684" cy="118" r="5"/><circle class="km-vx" cx="640" cy="155" r="5"/><text class="km-s" x="612" y="176">មានប្រវែងព្រំ និងផ្ទៃ · បិទជិត</text><circle class="km-nd" cx="34" cy="212" r="6"/><text class="km-xs" x="46" y="216">ថ្នាំង (node) · ចុងនៃធរណីមាត្រ</text><circle class="km-vx" cx="250" cy="212" r="5"/><text class="km-xs" x="262" y="216">កំពូល (vertex) · ចំណុចបត់</text><text class="km-xs" x="16" y="244">វត្ថុទាំងអស់ត្រូវបានរក្សាទុកជាបញ្ជីកូអរដោនេ។ ចំនួនកំពូលកាន់តែច្រើន ឯកសារកាន់តែធំ និងលម្អិត។</text></svg>
