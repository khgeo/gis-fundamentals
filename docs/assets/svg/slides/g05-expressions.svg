<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="440" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#00695c" text-anchor="start" font-weight="bold" class="ftitle">កន្សោម Field Calculator ដែលប្រើញឹកញាប់</text><rect x="40.0" y="100.0" width="560.0" height="44.0" rx="6" fill="#263238" stroke="none" stroke-width="1" /><text x="56.0" y="129.0" font-size="16" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace">$area / 10000</text><text x="620.0" y="129.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >ផ្ទៃ (ហិកតា) ក្នុង CRS ម៉ែត្រ</text><rect x="40.0" y="160.0" width="560.0" height="44.0" rx="6" fill="#263238" stroke="none" stroke-width="1" /><text x="56.0" y="189.0" font-size="16" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace">&quot;TOTPOP&quot; / &quot;HH_TOT&quot;</text><text x="620.0" y="189.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >ទំហំគ្រួសារមធ្យម</text><rect x="40.0" y="220.0" width="560.0" height="44.0" rx="6" fill="#263238" stroke="none" stroke-width="1" /><text x="56.0" y="249.0" font-size="16" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace">round(&quot;pct&quot;, 1)</text><text x="620.0" y="249.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >បង្គត់ ១ ខ្ទង់ទសភាគ</text><rect x="40.0" y="280.0" width="560.0" height="44.0" rx="6" fill="#263238" stroke="none" stroke-width="1" /><text x="56.0" y="309.0" font-size="16" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace">upper(&quot;COM_NAME&quot;)</text><text x="620.0" y="309.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >អក្សរធំ</text><rect x="40.0" y="340.0" width="560.0" height="44.0" rx="6" fill="#263238" stroke="none" stroke-width="1" /><text x="56.0" y="369.0" font-size="16" fill="#80cbc4" text-anchor="start" font-weight="normal" font-family="monospace">CASE WHEN &quot;TOTPOP&quot; &gt; 2000 THEN &#x27;ធំ&#x27; ELSE &#x27;តូច&#x27; END</text><text x="620.0" y="369.0" font-size="17" fill="#263238" text-anchor="start" font-weight="normal" >ចាត់ថ្នាក់</text></svg>