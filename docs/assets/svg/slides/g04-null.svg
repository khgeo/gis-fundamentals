<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="400" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#00695c" text-anchor="start" font-weight="bold" class="ftitle">NULL ធៀបនឹង ០</text><rect x="80.0" y="110.0" width="360.0" height="200.0" rx="12" fill="#e0f2f1" stroke="#00695c" stroke-width="2" /><text x="260.0" y="170.0" font-size="60" fill="#00695c" text-anchor="middle" font-weight="bold" >០</text><text x="260.0" y="240.0" font-size="17" fill="#263238" text-anchor="middle" font-weight="normal" >បានវាស់ ហើយតម្លៃគឺសូន្យ</text><text x="260.0" y="275.0" font-size="15" fill="#607d8b" text-anchor="middle" font-weight="normal" >ឧ. ករណីជំងឺ = ០</text><rect x="560.0" y="110.0" width="360.0" height="200.0" rx="12" fill="#fff3e0" stroke="#ff7043" stroke-width="2" /><text x="740.0" y="170.0" font-size="44" fill="#ff7043" text-anchor="middle" font-weight="bold" >NULL</text><text x="740.0" y="240.0" font-size="17" fill="#263238" text-anchor="middle" font-weight="normal" >មិនដឹង · មិនបានវាស់</text><text x="740.0" y="275.0" font-size="15" fill="#607d8b" text-anchor="middle" font-weight="normal" >ឧ. ភូមិមិនបានរាយការណ៍</text><text x="500.0" y="360.0" font-size="17" fill="#c62828" text-anchor="middle" font-weight="bold" >មធ្យម (៥, ០, NULL) = ២,៥ · មធ្យម (៥, ០, ០) = ១,៦៧</text></svg>