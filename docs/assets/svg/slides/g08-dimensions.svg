<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="480" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#00695c" text-anchor="start" font-weight="bold" class="ftitle">ធាតុផ្សំប្រាំនៃគុណភាពទិន្នន័យ (ISO 19157)</text><line x1="500.0" y1="270.0" x2="500.0" y2="100.0" stroke="#b2dfdb" stroke-width="2"/><circle cx="500.0" cy="100.0" r="62.00" fill="#1b9e77" stroke="none" stroke-width="1" opacity="0.9"/><text x="500.0" y="96.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" >ទីតាំង</text><text x="500.0" y="118.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="normal" >ត្រឹមត្រូវប៉ុណ្ណា?</text><line x1="500.0" y1="270.0" x2="661.7" y2="217.5" stroke="#b2dfdb" stroke-width="2"/><circle cx="661.7" cy="217.5" r="62.00" fill="#d95f02" stroke="none" stroke-width="1" opacity="0.9"/><text x="661.7" y="213.5" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" >គុណលក្ខណៈ</text><text x="661.7" y="235.5" font-size="12" fill="#fff" text-anchor="middle" font-weight="normal" >តម្លៃត្រូវទេ?</text><line x1="500.0" y1="270.0" x2="599.9" y2="407.5" stroke="#b2dfdb" stroke-width="2"/><circle cx="599.9" cy="407.5" r="62.00" fill="#7570b3" stroke="none" stroke-width="1" opacity="0.9"/><text x="599.9" y="403.5" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" >ពេញលេញ</text><text x="599.9" y="425.5" font-size="12" fill="#fff" text-anchor="middle" font-weight="normal" >ខ្វះ ឬលើស?</text><line x1="500.0" y1="270.0" x2="400.1" y2="407.5" stroke="#b2dfdb" stroke-width="2"/><circle cx="400.1" cy="407.5" r="62.00" fill="#e7298a" stroke="none" stroke-width="1" opacity="0.9"/><text x="400.1" y="403.5" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" >ស្របគ្នាតាមតក្កវិជ្ជា</text><text x="400.1" y="425.5" font-size="12" fill="#fff" text-anchor="middle" font-weight="normal" >ឋានលេខា ច្បាប់</text><line x1="500.0" y1="270.0" x2