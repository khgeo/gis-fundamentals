<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="420" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#00695c" text-anchor="start" font-weight="bold" class="ftitle">កំហុសទីតាំងជាតំបន់មិនច្បាស់</text><line x1="100.0" y1="220.0" x2="900.0" y2="220.0" stroke="#546e7a" stroke-width="2"/><rect x="100" y="190" width="800" height="60" fill="#ffcc80" opacity=".5"/><circle cx="520.0" cy="205.0" r="8.00" fill="#1565c0" stroke="none" stroke-width="1" opacity="1"/><text x="530.0" y="180.0" font-size="15" fill="#1565c0" text-anchor="start" font-weight="bold" >សាលា</text><text x="100.0" y="290.0" font-size="16" fill="#263238" text-anchor="start" font-weight="normal" >ផ្លូវ ± ១៥ ម (ពីរូបភាពចាស់)</text><text x="100.0" y="320.0" font-size="16" fill="#c62828" text-anchor="start" font-weight="normal" >សំណួរ៖ «សាលានៅក្នុង ១០ ម ពីផ្លូវឬទេ?» → ឆ្លើយមិនបានប្រាកដ</text></svg>