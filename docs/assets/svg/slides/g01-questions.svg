<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="480" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#00695c" text-anchor="start" font-weight="bold" class="ftitle">ប្រភេទសំណួរដែល GIS ឆ្លើយ</text><rect x="40.0" y="130.0" width="170.0" height="200.0" rx="16" fill="#00897b" stroke="none" stroke-width="1" /><text x="125.0" y="200.0" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >ទីតាំង</text><text x="125.0" y="250.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="normal" >នៅឯណា?</text><rect x="230.0" y="130.0" width="170.0" height="200.0" rx="16" fill="#1e88e5" stroke="none" stroke-width="1" /><text x="315.0" y="200.0" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >លក្ខខណ្ឌ</text><text x="315.0" y="250.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="normal" >កន្លែងណាមាន...?</text><rect x="420.0" y="130.0" width="170.0" height="200.0" rx="16" fill="#8e24aa" stroke="none" stroke-width="1" /><text x="505.0" y="200.0" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >និន្នាការ</text><text x="505.0" y="250.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="normal" >ប្រែប្រួលយ៉ាងណា?</text><rect x="610.0" y="130.0" width="170.0" height="200.0" rx="16" fill="#f4511e" stroke="none" stroke-width="1" /><text x="695.0" y="200.0" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >លំនាំ</text><text x="695.0" y="250.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="normal" >មានលំនាំអ្វី?</text><rect x="800.0" y="130.0" width="170.0" height="200.0" rx="16" fill="#6d4c41" stroke="none" stroke-width="1" /><text x="885.0" y="200.0" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >គំរូ</text><text x="885.0" y="250.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="normal" >បើ... នឹងកើតអ្វី?</text><text x="500.0" y="400.0" font-size="16" fill="#263238" text-anchor="middle" font-weight="normal" >ឧ. «ភូមិណាខ្លះនៅឆ្ងាយជាង ៥ គម ពីមណ្ឌលសុខភាព?» = សំណួរលក្ខខណ្ឌ</text></svg>