<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Battambang, Siemreap, sans-serif"><rect width="1000" height="460" fill="#ffffff"/><text x="24.0" y="38.0" font-size="24" fill="#00695c" text-anchor="start" font-weight="bold" class="ftitle">ម៉ាទ្រីសការផ្លាស់ប្ដូរ ១៩៩៧ → ២០១៥ (ហិកតា)</text><text x="60.0" y="130.0" font-size="16" fill="#263238" text-anchor="start" font-weight="normal" >ព្រៃ → Baren land</text><rect x="420.0" y="112.0" width="460.0" height="28.0" rx="0" fill="#e53935" stroke="none" stroke-width="1" /><text x="890.0" y="132.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >១៩ ២៧៥ ១២០.០</text><text x="60.0" y="180.0" font-size="16" fill="#263238" text-anchor="start" font-weight="normal" >ព្រៃ → Agricultural land</text><rect x="420.0" y="162.0" width="409.8" height="28.0" rx="0" fill="#e53935" stroke="none" stroke-width="1" /><text x="839.8" y="182.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >១៧ ១៧១ ៤៨០.០</text><text x="60.0" y="230.0" font-size="16" fill="#263238" text-anchor="start" font-weight="normal" >ព្រៃ → Water</text><rect x="420.0" y="212.0" width="70.6" height="28.0" rx="0" fill="#e53935" stroke="none" stroke-width="1" /><text x="500.6" y="232.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >២ ៩៥៦ ៤១៦.០</text><text x="60.0" y="280.0" font-size="16" fill="#263238" text-anchor="start" font-weight="normal" >ព្រៃ → Urban or built-up area</text><rect x="420.0" y="262.0" width="2.7" height="28.0" rx="0" fill="#e53935" stroke="none" stroke-width="1" /><text x="432.7" y="282.0" font-size="14" fill="#263238" text-anchor="start" font-weight="normal" >១១១ ២២៥.០</text></svg>