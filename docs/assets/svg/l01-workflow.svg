<svg viewBox="0 0 740 340" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-read-stack,'Siemreap',sans-serif);fill:var(--md-default-fg-color,#222);text-anchor:middle}.km-n{font-family:var(--km-emph-stack,'Battambang',sans-serif);font-size:12.5px;font-weight:700}.km-s{font-size:10.5px;fill:var(--md-default-fg-color--light,#666)}.km-box{fill:var(--md-default-fg-color--lightest,#eee);stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hi{fill:var(--md-primary-fg-color,#00897b);opacity:.16;stroke:var(--md-primary-fg-color,#00897b);stroke-width:2}.km-ar{stroke:var(--md-primary-fg-color,#00897b);stroke-width:2;fill:none;marker-end:url(#b)}.km-fb{stroke:#c0392b;stroke-width:1.8;fill:none;stroke-dasharray:6 4;marker-end:url(#r)}.km-num{font-size:11px;font-weight:700;fill:var(--md-primary-fg-color,#00897b)}</style><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--md-primary-fg-color,#00897b)"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs><rect class="km-hi" x="20" y="40" width="200" height="66" rx="8"/><text class="km-num" x="34" y="58">១</text><text class="km-n" x="120" y="70">កំណត់សំណួរ</text><text class="km-s" x="120" y="90">អ្នកណាត្រូវការលទ្ធផល?</text><rect class="km-box" x="268" y="40" width="200" height="66" rx="8"/><text class="km-num" x="282" y="58">២</text><text class="km-n" x="368" y="70">កំណត់ទិន្នន័យ</text><text class="km-s" x="368" y="90">អ្វីខ្លះ និងហេតុអ្វី?</text><rect class="km-box" x="516" y="40" width="200" height="66" rx="8"/><text class="km-num" x="530" y="58">៣</text><text class="km-n" x="616" y="70">ប្រមូល និងពិនិត្យ</text><text class="km-s" x="616" y="90">ប្រភព · កាលបរិច្ឆេទ · CRS</text><path class="km-ar" d="M224 73 L262 73"/><path class="km-ar" d="M472 73 L510 73"/><path class="km-ar" d="M616 110 L616 150"/><rect class="km-box" x="516" y="152" width="200" height="66" rx="8"/><text class="km-num" x="530" y="170">៤</text><text class="km-n" x="616" y="182">រៀបចំ និងវិភាគ</text><text class="km-s" x="616" y="202">អនុវត្តវិធីសាស្ត្រ</text><rect class="km-box" x="268" y="152" width="200" height="66" rx="8"/><text class="km-num" x="282" y="170">៥</text><text class="km-n" x="368" y="182">ផ្ទៀងផ្ទាត់</text><text class="km-s" x="368" y="202">លទ្ធផលសមហេតុផលទេ?</text><rect class="km-hi" x="20" y="152" width="200" height="66" rx="8"/><text class="km-num" x="34" y="170">៦</text><text class="km-n" x="120" y="182">បង្ហាញលទ្ធផល</text><text class="km-s" x="120" y="202">ផែនទី · ការសន្មត · ដែនកំណត់</text><path class="km-ar" d="M510 185 L474 185"/><path class="km-ar" d="M262 185 L226 185"/><path class="km-fb" d="M368 148 C368 128 500 128 606 116"/><text class="km-s" x="420" y="128" fill="#c0392b">បើមិនសមហេតុផល ត្រឡប់ទៅពិនិត្យទិន្នន័យ</text><text class="km-s" x="370" y="262">ការសន្មត ប្រភព និងវិធីសាស្ត្រ ត្រូវកត់ត្រាពេញគ្រប់ដំណាក់កាល</text><text class="km-s" x="370" y="284">មិនមែនត្រឹមពេលបញ្ចប់ការងារទេ</text></svg>
