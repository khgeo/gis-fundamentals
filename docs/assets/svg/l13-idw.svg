<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><rect class="km-land" x="20" y="20" width="470" height="220" rx="6"/><line class="" x1="260" y1="130" x2="120" y2="70" style="stroke:#1565c0;stroke-width:3.741379310344828"/><circle cx="120" cy="70" r="9" fill="#e65100" stroke="#fff" stroke-width="2" opacity="1"/><text class="km-xs" x="132" y="62" text-anchor="start" font-weight="700">ក ១៨០ មម</text><line class="" x1="260" y1="130" x2="400" y2="90" style="stroke:#1565c0;stroke-width:4.0"/><circle cx="400" cy="90" r="9" fill="#e65100" stroke="#fff" stroke-width="2" opacity="1"/><text class="km-xs" x="412" y="82" text-anchor="start" font-weight="700">ខ ២៤០ មម</text><line class="" x1="260" y1="130" x2="210" y2="220" style="stroke:#1565c0;stroke-width:7.0"/><circle cx="210" cy="220" r="9" fill="#e65100" stroke="#fff" stroke-width="2" opacity="1"/><text class="km-xs" x="222" y="212" text-anchor="start" font-weight="700">គ ១២០ មម</text><line class="" x1="260" y1="130" x2="380" y2="210" style="stroke:#1565c0;stroke-width:4.057692307692308"/><circle cx="380" cy="210" r="9" fill="#e65100" stroke="#fff" stroke-width="2" opacity="1"/><text class="km-xs" x="392" y="202" text-anchor="start" font-weight="700">ឃ ៣១០ មម</text><circle cx="260" cy="130" r="9" fill="#fff" stroke="#1565c0" stroke-width="3" opacity="1"/><text class="km-t" x="272" y="152" text-anchor="start">?</text><text class="km-t" x="510" y="50" text-anchor="start">IDW (p = ២)</text><text class="km-s" x="510" y="80" text-anchor="start">ទម្ងន់ = ១ ÷ ចម្ងាយ²</text><text class="km-s" x="510" y="110" text-anchor="start">ស្ថានីយ៍ជិត → បន្ទាត់ក្រាស់</text><text class="km-s" x="510" y="140" text-anchor="start">= ឥទ្ធិពលខ្លាំងជាង</text><text class="km-s" x="510" y="180" text-anchor="start" font-weight="700">តម្លៃប៉ាន់ស្មាន ≈ ១៩៥ មម</text><text class="km-xs" x="510" y="210" text-anchor="start">មិនលើស ៣១០ · មិនទាបជាង ១២០</text></svg>
