<svg viewBox="0 0 700 490" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-read-stack,'Siemreap',sans-serif);fill:var(--md-default-fg-color,#222)}.km-lbl{font-family:var(--km-emph-stack,'Battambang',sans-serif);font-size:13px;font-weight:700}.km-s{font-size:11.5px}.km-xs{font-size:10.5px;fill:var(--md-default-fg-color--light,#666)}.km-bg{fill:var(--md-default-fg-color--lightest,#f2f2f2);stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-rv{stroke:#4a90d9;stroke-width:9;fill:none;opacity:.7}.km-rd{stroke:#8a7a5c;stroke-width:4;fill:none}.km-dash{stroke:#c0392b;stroke-width:2;stroke-dasharray:7 5;fill:none}.km-v{fill:#c0392b}.km-sc{fill:#1f6fb2}.km-km{font-size:11.5px;font-weight:700;font-family:var(--km-emph-stack,'Battambang',sans-serif)}</style><rect class="km-bg" x="14" y="14" width="672" height="404" rx="8"/><path class="km-rv" d="M380 20 L380 412"/><text class="km-xs" x="390" y="40">ទន្លេ</text><path class="km-rd" d="M250 150 L110 150"/><path class="km-rd" d="M250 150 L250 380 L510 380 L510 150"/><rect x="362" y="370" width="36" height="20" rx="3" fill="#8a7a5c"/><text class="km-xs" x="404" y="386">ស្ពាន</text><path class="km-dash" d="M250 150 L510 150"/><circle class="km-v" cx="250" cy="150" r="9"/><text class="km-lbl" x="236" y="132">V1</text><circle class="km-sc" cx="510" cy="150" r="9"/><text class="km-lbl" x="524" y="154">S1</text><circle class="km-sc" cx="110" cy="150" r="9"/><text class="km-lbl" x="80" y="154">S2</text><text class="km-km" x="150" y="140">៣ គម</text><text class="km-km" x="338" y="142">២ គម</text><text class="km-xs" x="316" y="172">(ចម្ងាយត្រង់)</text><text class="km-km" x="196" y="270">៤ គម</text><text class="km-km" x="300" y="404">២ គម</text><text class="km-km" x="522" y="270">៤ គម</text><text class="km-s" x="20" y="444">— — —  ចម្ងាយត្រង់ · មិនគិតពីទន្លេ និងផ្លូវ</text><text class="km-s" x="20" y="468">———  ចម្ងាយតាមផ្លូវ · ឆ្លងទន្លេបានតែតាមស្ពាន</text><text class="km-s" x="380" y="444">V1 ទៅ S1 តាមផ្លូវ = ៤ + ២ + ៤ = ១០ គម</text><text class="km-s" x="380" y="468">V1 ទៅ S2 តាមផ្លូវ = ៣ គម</text></svg>
