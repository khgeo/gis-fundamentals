<svg viewBox="0 0 740 300" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-read-stack,'Siemreap',sans-serif);fill:var(--md-default-fg-color,#222)}.km-h{font-family:var(--km-emph-stack,'Battambang',sans-serif);font-size:12.5px;font-weight:700;text-anchor:middle}.km-s{font-size:10px;text-anchor:middle}.km-ttl{font-family:var(--km-emph-stack,'Battambang',sans-serif);font-size:13px;font-weight:700}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.4}.km-a{fill:#7fb77e;opacity:.5;stroke:#2f6b2f;stroke-width:1.6}.km-b{fill:#e8b06a;opacity:.5;stroke:#a0722a;stroke-width:1.6}.km-ln{stroke:#1f6fb2;stroke-width:2.4;fill:none}.km-err{stroke:#c0392b;stroke-width:2;fill:none}.km-errf{fill:#c0392b;opacity:.35;stroke:#c0392b;stroke-width:1.4}</style><text class="km-ttl" x="16" y="16">ក. ទំនាក់ទំនងឋានលេខា</text><rect class="km-box" x="16" y="26" width="220" height="112" rx="6"/><path class="km-a" d="M40 46 L120 46 L120 118 L40 118 Z"/><path class="km-b" d="M120 46 L210 46 L210 118 L120 118 Z"/><text class="km-h" x="126" y="156">ភាពជាប់គ្នា</text><text class="km-s" x="126" y="172">ចែករំលែកព្រំដែនរួម</text><rect class="km-box" x="258" y="26" width="220" height="112" rx="6"/><path class="km-ln" d="M280 110 L330 62 L400 100 L456 58"/><circle cx="330" cy="62" r="5" fill="#c0392b"/><circle cx="400" cy="100" r="5" fill="#c0392b"/><text class="km-h" x="368" y="156">ការតភ្ជាប់</text><text class="km-s" x="368" y="172">ជួបគ្នានៅថ្នាំងរួម</text><rect class="km-box" x="500" y="26" width="224" height="112" rx="6"/><path class="km-a" d="M524 42 L700 42 L700 122 L524 122 Z"/><circle cx="580" cy="78" r="6" fill="#c0392b"/><circle cx="650" cy="96" r="6" fill="#c0392b"/><text class="km-h" x="612" y="156">ការរុំព័ទ្ធ</text><text class="km-s" x="612" y="172">វត្ថុស្ថិតក្នុងព្រំដែន</text><text class="km-ttl" x="16" y="206">ខ. កំហុសធរណីមាត្រទូទៅ</text><rect class="km-box" x="16" y="216" width="160" height="70" rx="6"/><path class="km-a" d="M32 228 L96 228 L96 276 L32 276 Z"/><path class="km-b" d="M104 228 L162 228 L162 276 L104 276 Z"/><path class="km-errf" d="M96 228 L104 228 L104 276 L96 276 Z"/><text class="km-s" x="96" y="298">គម្លាត (gap)</text><rect class="km-box" x="196" y="216" width="160" height="70" rx="6"/><path class="km-a" d="M212 228 L286 228 L286 276 L212 276 Z"/><path class="km-b" d="M276 228 L340 228 L340 276 L276 276 Z"/><text class="km-s" x="276" y="298">ត្រួតគ្នា (overlap)</text><rect class="km-box" x="376" y="216" width="160" height="70" rx="6"/><path class="km-ln" d="M392 252 L470 252"/><path class="km-ln" d="M470 226 L470 278"/><path class="km-err" d="M470 252 L512 252"/><text class="km-s" x="456" y="298">លើសចុង (overshoot)</text><rect class="km-box" x="556" y="216" width="168" height="70" rx="6"/><path class="km-ln" d="M572 252 L636 252"/><path class="km-ln" d="M660 226 L660 278"/><circle cx="636" cy="252" r="5" fill="#c0392b"/><text class="km-s" x="640" y="298">ខ្វះចុង (undershoot)</text></svg>
