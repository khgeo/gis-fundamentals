<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12px}.km-xs{font-size:10.5px;fill:var(--md-default-fg-color--light,#666)}.km-r1{fill:var(--md-default-fg-color--lightest,#eee);stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-r2{fill:var(--md-primary-fg-color,#00897b);opacity:.12;stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.5}.km-r3{fill:var(--md-primary-fg-color,#00897b);opacity:.28;stroke:var(--md-primary-fg-color,#00897b);stroke-width:2}.km-ar{stroke:var(--md-primary-fg-color,#00897b);stroke-width:2;fill:none;marker-end:url(#a)}.km-pl{fill:var(--md-primary-fg-color,#00897b);font-size:20px;font-weight:700;text-anchor:middle}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--md-primary-fg-color,#00897b)"/></marker></defs><rect class="km-r1" x="20" y="18" width="330" height="76" rx="8"/><text class="km-t" x="36" y="44">ទិន្នន័យ</text><text class="km-xs" x="112" y="44">Data</text><text class="km-s" x="36" y="72">«មណ្ឌលសុខភាពចំការដូង»</text><text class="km-s" x="392" y="46">ឈ្មោះមួយឯង។ យើងមិនដឹងថាវាធ្វើអ្វី</text><text class="km-s" x="392" y="72">ឬនៅទីណាទេ។</text><path class="km-ar" d="M185 96 L185 124"/><text class="km-pl" x="215" y="120">+</text><rect class="km-r2" x="20" y="130" width="330" height="96" rx="8"/><text class="km-t" x="36" y="156">ព័ត៌មាន</text><text class="km-xs" x="116" y="156">Information</text><text class="km-s" x="36" y="182">បើក ៧:០០ ដល់ ១១:៣០ · ឆ្មប ២ នាក់</text><text class="km-s" x="36" y="208">បម្រើ ៨ ភូមិ · មានទូរទឹកកកវ៉ាក់សាំង</text><text class="km-s" x="392" y="164">ឥឡូវយើងដឹងថាវាធ្វើអ្វី។ តែនៅតែ</text><text class="km-s" x="392" y="190">មិនអាចរកឃើញវាលើផែនទីបានទេ។</text><path class="km-ar" d="M185 228 L185 256"/><text class="km-pl" x="215" y="252">+</text><rect class="km-r3" x="20" y="262" width="330" height="96" rx="8"/><text class="km-t" x="36" y="288">ព័ត៌មានលំហ</text><text class="km-xs" x="146" y="288">Spatial Information</text><text class="km-s" x="36" y="314">រយៈទទឹង ១១.៥៥៦៤° ខាងជើង</text><text class="km-s" x="36" y="340">រយៈបណ្ដោយ ១០៤.៩២៨២° ខាងកើត</text><text class="km-s" x="392" y="296">ឥឡូវយើងអាចសួរបានថា៖ តើភូមិណា</text><text class="km-s" x="392" y="322">ខ្លះនៅឆ្ងាយពីមណ្ឌលនេះលើសពី</text><text class="km-s" x="392" y="348">១០ គីឡូម៉ែត្រ?</text><text class="km-xs" x="20" y="382">កូអរដោនេជាជំហានដែលប្រែព័ត៌មានធម្មតាទៅជាព័ត៌មានដែល GIS អាចគណនាបាន។</text></svg>
