<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><text class="km-t" x="190" y="20" text-anchor="middle">ចំនួនប្រជាជនដុល</text><text class="km-t" x="570" y="20" text-anchor="middle">ដង់ស៊ីតេ (នាក់/គម²)</text><path transform="translate(0 0)" d="M30 40 L250 40 L250 230 L30 230Z" fill="#cb181d" stroke="#555" stroke-width="1"/><text class="km-xs" x="140" y="140" text-anchor="middle" style="fill:#fff">ឃុំជនបទធំ</text><text class="km-xs" x="140" y="156" text-anchor="middle" style="fill:#fff">១៥ ០០០</text><path transform="translate(0 0)" d="M260 40 L340 40 L340 120 L260 120Z" fill="#fb6a4a" stroke="#555" stroke-width="1"/><text class="km-xs" x="300" y="85" text-anchor="middle" style="fill:#fff">ក្រុង</text><text class="km-xs" x="300" y="101" text-anchor="middle" style="fill:#fff">៩ ០០០</text><path transform="translate(0 0)" d="M260 130 L340 130 L340 230 L260 230Z" fill="#fcae91" stroke="#555" stroke-width="1"/><text class="km-xs" x="300" y="185" text-anchor="middle">ឃុំតូច</text><text class="km-xs" x="300" y="201" text-anchor="middle">៤ ០០០</text><path transform="translate(380 0)" d="M30 40 L250 40 L250 230 L30 230Z" fill="#fee5d9" stroke="#555" stroke-width="1"/><text class="km-xs" x="520" y="140" text-anchor="middle">ឃុំជនបទធំ</text><text class="km-xs" x="520" y="156" text-anchor="middle">១៥០</text><path transform="translate(380 0)" d="M260 40 L340 40 L340 120 L260 120Z" fill="#cb181d" stroke="#555" stroke-width="1"/><text class="km-xs" x="680" y="85" text-anchor="middle" style="fill:#fff">ក្រុង</text><text class="km-xs" x="680" y="101" text-anchor="middle" style="fill:#fff">២ ៨០០</text><path transform="translate(380 0)" d="M260 130 L340 130 L340 230 L260 230Z" fill="#fcae91" stroke="#555" stroke-width="1"/><text class="km-xs" x="680" y="185" text-anchor="middle">ឃុំតូច</text><text class="km-xs" x="680" y="201" text-anchor="middle">៩០០</text><text class="km-s" x="380" y="252" text-anchor="middle">ឃុំធំមើលទៅ «សំខាន់» ក្នុងផែនទីចំនួនដុល ដោយសារមានផ្ទៃធំ</text></svg>
