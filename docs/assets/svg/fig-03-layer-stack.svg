<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:13.5px;font-weight:700}.km-s{font-size:11.5px}.km-pl{stroke:var(--md-default-fg-color--light,#999);stroke-width:1.3}.km-br{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.2;stroke-dasharray:3 3;opacity:.75}</style><g transform="translate(40,0)"><g><polygon class="km-pl" points="0,60 300,0 480,60 180,120" fill="#e8b06a" opacity=".55"/><text class="km-t" x="500" y="66">ផែនទីប្រើប្រាស់ដី</text><text class="km-s" x="500" y="84">ពហុកោណ</text></g><g><polygon class="km-pl" points="0,140 300,80 480,140 180,200" fill="#7fb77e" opacity=".55"/><path d="M60 148 C140 120 200 132 300 104" stroke="#2f6b2f" stroke-width="3" fill="none" opacity=".8"/><text class="km-t" x="500" y="146">បណ្ដាញទន្លេ</text><text class="km-s" x="500" y="164">បន្ទាត់</text></g><g><polygon class="km-pl" points="0,220 300,160 480,220 180,280" fill="#d98c8c" opacity=".55"/><circle cx="110" cy="222" r="6" fill="#a83232"/><circle cx="210" cy="198" r="6" fill="#a83232"/><circle cx="300" cy="224" r="6" fill="#a83232"/><text class="km-t" x="500" y="226">មណ្ឌលសុខភាព</text><text class="km-s" x="500" y="244">ចំណុច</text></g><g><polygon class="km-pl" points="0,300 300,240 480,300 180,360" fill="#8fa9c9" opacity=".6"/><text class="km-t" x="500" y="306">រូបភាពផ្កាយរណប</text><text class="km-s" x="500" y="324">រ៉ាស្ទ័រ</text></g><line class="km-br" x1="210" y1="52" x2="210" y2="292"/><line class="km-br" x1="300" y1="82" x2="300" y2="322"/></g><text class="km-s" x="10" y="376">ស្រទាប់នីមួយៗរក្សាទុកដាច់ដោយឡែក តែត្រួតលើគ្នាតាមទីតាំងភូមិសាស្ត្រពិត។</text></svg>
