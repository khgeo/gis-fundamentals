<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-read-stack,'Siemreap',sans-serif);fill:var(--md-default-fg-color,#222)}.km-h{font-family:var(--km-emph-stack,'Battambang',sans-serif);font-size:16.5px;font-weight:700;text-anchor:middle}.km-s{font-size:13.4px}.km-xs{font-size:12.2px;fill:var(--md-default-fg-color--light,#666)}.km-box{fill:var(--md-default-fg-color--lightest,#eee);stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-v{fill:#c0392b}.km-sc{fill:#1f6fb2}.km-rd{stroke:#8a7a5c;stroke-width:3;fill:none}.km-rv{stroke:#4a90d9;stroke-width:5;fill:none;opacity:.75}.km-q{font-size:13.4px;fill:var(--md-primary-fg-color,#00897b)}</style><text class="km-h" x="180" y="20">ក. ស្រទាប់ចំណុចតែប៉ុណ្ណោះ</text><rect class="km-box" x="20" y="32" width="320" height="230" rx="6"/><circle class="km-v" cx="110" cy="120" r="7"/><text class="km-s" x="122" y="124">V1</text><circle class="km-sc" cx="255" cy="120" r="7"/><text class="km-s" x="267" y="124">S1</text><circle class="km-sc" cx="70" cy="120" r="7"/><text class="km-s" x="40" y="124">S2</text><text class="km-q" x="36" y="230">មើលទៅ S1 នៅជិត V1 ជាង S2។</text><text class="km-h" x="580" y="20">ខ. បន្ថែមផ្លូវ និងទន្លេ</text><rect class="km-box" x="420" y="32" width="320" height="230" rx="6"/><path class="km-rv" d="M580 40 L580 254"/><path class="km-rd" d="M510 120 L470 120"/><path class="km-rd" d="M510 120 L510 225 L655 225 L655 120"/><rect x="570" y="218" width="20" height="14" fill="#8a7a5c"/><circle class="km-v" cx="510" cy="120" r="7"/><text class="km-s" x="522" y="112">V1</text><circle class="km-sc" cx="655" cy="120" r="7"/><text class="km-s" x="667" y="124">S1</text><circle class="km-sc" cx="470" cy="120" r="7"/><text class="km-s" x="440" y="124">S2</text><text class="km-xs" x="586" y="60">ទន្លេ</text><text class="km-xs" x="596" y="248">ស្ពាន</text><text class="km-q" x="436" y="230">ទន្លេបំបែក V1 ពី S1។</text><text class="km-s" x="20" y="290">ស្រទាប់ចំណុចបង្ហាញ <tspan class="km-h" style="text-anchor:start">ទីតាំង</tspan>។ ស្រទាប់ផ្លូវ និងទន្លេបង្ហាញ <tspan class="km-h" style="text-anchor:start">ការតភ្ជាប់</tspan>។</text><text class="km-s" x="20" y="312">ការមើលទីតាំងតែឯង អាចនាំឲ្យសន្និដ្ឋានខុស។</text></svg>
