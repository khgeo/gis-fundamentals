<svg viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" role="img" class="km-fig"><style>.km-fig{width:100%;height:auto}.km-fig text{font-family:var(--km-stack,'Battambang',sans-serif);fill:var(--md-default-fg-color,#222)}.km-t{font-size:15px;font-weight:700}.km-s{font-size:12.5px}.km-xs{font-size:11px}.km-box{fill:none;stroke:var(--md-default-fg-color--lighter,#bbb);stroke-width:1.5}.km-hdr{fill:var(--md-primary-fg-color,#00897b);opacity:.14}.km-line{stroke:var(--md-primary-fg-color,#00897b);stroke-width:1.4;stroke-dasharray:4 3;fill:none}.km-pt{fill:var(--md-primary-fg-color,#00897b)}.km-land{fill:var(--md-default-fg-color--lightest,#eee)}.km-arr{stroke:var(--md-default-fg-color--light,#666);stroke-width:1.6;fill:none;marker-end:url(#ah)}.km-ok{fill:#2e7d32}.km-bad{fill:#c62828}.km-mono{font-family:monospace!important;font-size:11.5px}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker></defs><rect class="" x="20" y="110" width="170" height="152" rx="6" style="fill:#b3e5fc;opacity:0.6"/><text class="km-t" x="105" y="134" text-anchor="middle">Nominal</text><text class="km-xs" x="105" y="154" text-anchor="middle">ឈ្មោះ ប្រភេទ</text><text class="km-xs" x="105" y="222" text-anchor="middle">ប្រភេទក្រប់ដី</text><text class="km-xs" x="105" y="246" text-anchor="middle" font-weight="700">= ≠ · រាប់</text><rect class="" x="205" y="82" width="170" height="180" rx="6" style="fill:#81d4fa;opacity:0.6"/><text class="km-t" x="290" y="106" text-anchor="middle">Ordinal</text><text class="km-xs" x="290" y="126" text-anchor="middle">មានលំដាប់</text><text class="km-xs" x="290" y="222" text-anchor="middle">ស្ថានភាពផ្លូវ</text><text class="km-xs" x="290" y="246" text-anchor="middle" font-weight="700">+ ធំ/តូចជាង · median</text><rect class="" x="390" y="54" width="170" height="208" rx="6" style="fill:#4fc3f7;opacity:0.6"/><text class="km-t" x="475" y="78" text-anchor="middle">Interval</text><text class="km-xs" x="475" y="98" text-anchor="middle">ចន្លោះស្មើ</text><text class="km-xs" x="475" y="222" text-anchor="middle">សីតុណ្ហភាព °C</text><text class="km-xs" x="475" y="246" text-anchor="middle" font-weight="700">+ បូក ដក · មធ្យម</text><rect class="" x="575" y="26" width="170" height="236" rx="6" style="fill:#29b6f6;opacity:0.6"/><text class="km-t" x="660" y="50" text-anchor="middle">Ratio</text><text class="km-xs" x="660" y="70" text-anchor="middle">មានសូន្យពិត</text><text class="km-xs" x="660" y="222" text-anchor="middle">ប្រជាជន ផ្ទៃ</text><text class="km-xs" x="660" y="246" text-anchor="middle" font-weight="700">+ គុណ ចែក · ភាគរយ</text><line class="km-arr" x1="20" y1="282" x2="740" y2="282"/><text class="km-xs" x="20" y="277" text-anchor="start">ការគណនាដែលអនុញ្ញាតកើនឡើង →</text></svg>
